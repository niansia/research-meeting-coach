name: Bug report
description: Report a reproducible routing, grounding, validation, or packaging problem.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste unpublished research, advisor identities, private messages, or source-register URLs. Replace them with the smallest synthetic reproduction.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.3.0-alpha
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skill behavior or routing
        - RMS or schema validation
        - Numeric or source grounding
        - Advisor profile grounding
        - Release packaging
        - Documentation or installation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include the command or prompt, synthetic input, observed result, and expected result.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains no private research data or identifiable advisor/student information.
          required: true
